name: CI

on:
  pull_request:
    branches: ["approof/main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: approofworkspace_test
          POSTGRES_USER: approof
          POSTGRES_PASSWORD: approof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U approof -d approofworkspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://approof:approof@localhost:5432/approofworkspace_test
      API_KEY_PEPPER: ci-only-api-key-pepper-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            server/yarn.lock
            frontend/yarn.lock
            collector/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn install --frozen-lockfile
        working-directory: server
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn install --frozen-lockfile
        working-directory: collector
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          SHARP_IGNORE_GLOBAL_LIBVIPS: "true"
      - run: yarn lint:ci
      - run: yarn prisma migrate deploy --schema prisma/schema.prisma
        working-directory: server
      - run: yarn test
        working-directory: server
