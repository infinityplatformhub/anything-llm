# #73 — Milvus for the real-store ACL suite.
#
# Compose rather than a GitHub `services:` block, for two reasons that `services:` cannot
# express: Milvus needs `milvus run standalone` as its command, and it must not start
# before etcd and MinIO are HEALTHY (not merely started). `services:` supports neither a
# command nor depends_on, so a `services:`-based Milvus starts, fails to reach its
# dependencies, and exits — leaving the suite to skip while CI stays green, which is the
# exact failure this issue exists to close.
#
# Versions are pinned. A floating tag turns a green pipeline red on someone else's release
# schedule, and the ACL predicate this suite guards is sensitive to engine behaviour.

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.3.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # 9091 is Milvus's HTTP metrics/health port; 19530 speaks gRPC and cannot be probed
      # with curl. The suite's own connect() is the real proof — this only decides when to
      # stop waiting.
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
