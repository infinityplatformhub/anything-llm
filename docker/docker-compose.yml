name: approofworkspace

networks:
  anything-llm:
    driver: bridge

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-approofworkspace}
      POSTGRES_USER: ${POSTGRES_USER:-approof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-approof}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-approof} -d ${POSTGRES_DB:-approofworkspace}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - anything-llm

  anything-llm:
    container_name: approofworkspace
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-approof}:${POSTGRES_PASSWORD:-approof}@postgres:5432/${POSTGRES_DB:-approofworkspace}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
